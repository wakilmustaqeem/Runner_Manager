# Gradle wrapper intent declaration only.
# scripts (gradlew, gradlew.bat) and gradle-wrapper.jar are NOT yet present.
# Generate them from this file once a network-accessible environment is
# available:
#
#   gradle-8.9/bin/gradle wrapper --gradle-version 8.9
#
# Then commit gradlew, gradlew.bat, and gradle/wrapper/gradle-wrapper.jar
# from that same verified distribution.
#
# TODO before first executable wrapper use:
#   - Obtain official SHA-256 for gradle-8.9-bin.zip from
#     https://gradle.org/release-checksums/
#   - Uncomment and populate distributionSha256Sum below.
#   Until then, distribution SHA-256 verification is DISABLED.

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
# distributionSha256Sum=<FILL-FROM-OFFICIAL-CHECKSUM>
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
