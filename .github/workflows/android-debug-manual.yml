name: Local Mobile Runner SDK Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feat/local-runner-sdk-diagnostics-2026-10-14
    paths:
      - '.github/workflows/android-debug-manual.yml'

permissions:
  contents: read

concurrency:
  group: runner-manager-local-sdk-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect local Android build tools and download reachability
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Inspect runner environment and network without installing tools
        shell: bash
        run: |
          set +e
          echo "=== Device/runtime ==="
          uname -a
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "=== Java ==="
          command -v java || true
          java -version 2>&1 || true
          echo "=== Gradle ==="
          command -v gradle || true
          gradle --version 2>&1 | head -n 12 || true
          echo "=== Android SDK environment ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "=== sdkmanager locations ==="
          command -v sdkmanager || true
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Android/Sdk" "$HOME/android-sdk" /opt/android-sdk /usr/lib/android-sdk; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "FOUND_SDK_DIR=$d"
              ls -la "$d" | head -n 20
              [ ! -d "$d/platforms" ] || ls -1 "$d/platforms"
              [ ! -d "$d/build-tools" ] || ls -1 "$d/build-tools"
            fi
          done
          echo "=== Network reachability (HEAD, 10-second cap) ==="
          for url in "https://dl.google.com/android/repository/repository2-1.xml" "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" "https://dl.google.com/dl/android/maven2/" "https://services.gradle.org/distributions/gradle-8.9-bin.zip" "https://github.com/actions/checkout"; do
            echo "--- $url"
            curl -IL --connect-timeout 5 --max-time 10 --silent --show-error -o /dev/null -w "http_code=%{http_code} connect=%{time_connect}s total=%{time_total}s remote_ip=%{remote_ip}\n" "$url" 2>&1 || true
          done
          echo "=== Gradle project files ==="
          find . -maxdepth 3 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' \) -print | head -n 40
          echo "Diagnostics complete; no SDK packages were downloaded or installed."