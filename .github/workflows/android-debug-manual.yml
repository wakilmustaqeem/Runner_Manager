name: Android Debug Build (Manual)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-sdk-setup-retry-2026-10-14

permissions:
  contents: read

concurrency:
  group: runner-manager-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and test debug APK
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Google SDK downloads previously timed out once. Retry setup up to three
      # times; do not change runner registration or install OS-level packages.
      - name: Set up Android SDK (attempt 1)
        id: android_sdk_1
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Retry Android SDK setup (attempt 2)
        id: android_sdk_2
        if: steps.android_sdk_1.outcome == 'failure'
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Retry Android SDK setup (attempt 3)
        id: android_sdk_3
        if: steps.android_sdk_2.outcome == 'failure'
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Stop if Android SDK setup failed after retries
        if: steps.android_sdk_1.outcome == 'failure' && steps.android_sdk_2.outcome == 'failure' && steps.android_sdk_3.outcome == 'failure'
        run: |
          echo "Android SDK setup failed on all three attempts."
          exit 1

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and run available unit tests
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      - name: Upload debug APK (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: fm-runner-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
