name: Android Debug Build (Manual)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/fm-runner-manager-foundation-2026-10-13

permissions:
  contents: read

concurrency:
  group: runner-manager-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and test debug APK
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and run available unit tests
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      - name: Upload debug APK (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: fm-runner-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
